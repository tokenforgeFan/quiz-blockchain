<style>
/* Layout: une chaîne verticale de blocs (niveaux) reliés par leur hash ; un bloc se « mine » en réussissant son quiz. */
:root{
  --bg:#f6f4ff; --surface:#ffffff; --ink:#14123b; --muted:#5c5a7a; --line:#e6e1fb;
  --accent:#5b3df5; --accent-ink:#ffffff; --good:#17a35b; --good-bg:#e3f8ec; --bad:#d4372c; --bad-bg:#fde8e6;
  --display:"Plus Jakarta Sans",system-ui,sans-serif; --body:"Plus Jakarta Sans",system-ui,-apple-system,Roboto,sans-serif; --mono:ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f0d1f; --surface:#1a1733; --ink:#ece9ff; --muted:#a7a3c9; --line:#2d2850;
  --accent:#7c63ff; --accent-ink:#ffffff; --good:#4fd58d; --good-bg:#143425; --bad:#ff7d72; --bad-bg:#3d1c19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f0d1f; --surface:#1a1733; --ink:#ece9ff; --muted:#a7a3c9; --line:#2d2850;
  --accent:#7c63ff; --accent-ink:#ffffff; --good:#4fd58d; --good-bg:#143425; --bad:#ff7d72; --bad-bg:#3d1c19; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,5vw,2.1rem);line-height:1.15;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:8px 0 0;max-width:60ch}
.rule{font-family:var(--mono);font-size:.8rem;color:var(--muted);margin-top:14px;letter-spacing:.02em}
.rule b{color:var(--accent)}
.chain{display:flex;flex-direction:column;margin-top:28px}
.link{height:26px;margin-left:30px;border-left:2px dashed var(--line)}
.link.ok{border-left:2px solid var(--accent)}
.block{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.block.locked{opacity:.55}
.num{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;font-family:var(--mono);font-weight:600;border:2px solid var(--line);color:var(--muted)}
.block.mined .num{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.block.open .num{border-color:var(--accent);color:var(--accent)}
.info{min-width:0;display:flex;flex-direction:column;gap:6px}
.info h2{font-family:var(--display);font-weight:500;font-size:1.02rem;margin:0;line-height:1.3}
.meta{font-family:var(--mono);font-size:.75rem;color:var(--muted);overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:4px}
.chip{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.chip.ok{border-color:var(--good);color:var(--good);background:var(--good-bg)}
.chip.ko{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
button{font:inherit;cursor:pointer;border-radius:8px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;padding:10px 16px;font-weight:700}
.btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);padding:9px 14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:16px 0 22px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qnum{font-family:var(--mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.q{font-family:var(--display);font-weight:500;font-size:clamp(1.05rem,3.6vw,1.3rem);line-height:1.35;margin:0 0 18px;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:13px 14px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--mono);font-weight:600;color:var(--muted)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fb{margin-top:16px;padding:14px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.fb strong{display:block;margin-bottom:4px}
.fb.ok strong{color:var(--good)} .fb.ko strong{color:var(--bad)}
.next{margin-top:16px;display:flex;justify-content:flex-end}
.score{font-family:var(--display);font-weight:700;font-size:clamp(3rem,14vw,5rem);line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:.4em;color:var(--muted)}
.verdict{font-size:1.1rem;margin:10px 0 20px}
.review{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.review div{border-left:3px solid var(--bad);padding:4px 0 4px 12px}
.review p{margin:0} .review .a{color:var(--good);font-weight:700}
.course{margin-top:30px;display:flex;flex-direction:column;gap:16px}
.course>h2{font-family:var(--display);font-weight:700;font-size:1.25rem;margin:0}
.course>p{margin:0;color:var(--muted)}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px}
.lesson h3{font-family:var(--display);font-weight:500;font-size:1.05rem;margin:0;line-height:1.3}
.lesson .cnt{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--bad)}
.lesson p{margin:0;max-width:65ch}
.lesson .ex{border-left:3px solid var(--accent);padding-left:12px}
.lesson .ex b,.lesson .key b{font-family:var(--mono);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;display:block;color:var(--muted);margin-bottom:2px}
.lesson .key{background:var(--good-bg);border-radius:8px;padding:10px 12px}
.lesson details{border-top:1px solid var(--line);padding-top:10px}
.lesson summary{cursor:pointer;font-weight:700;color:var(--muted)}
.lesson .qa{margin-top:10px;display:flex;flex-direction:column;gap:10px}
.lesson .qa div{font-size:.95rem}
.lesson .qa .a{color:var(--good);font-weight:700}
.lesson .qa .you{color:var(--bad)}
.foot{margin-top:36px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.acct{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.acct .who{font-family:var(--mono);font-size:.85rem;margin-right:auto}
.sm{padding:6px 11px;font-size:.88rem}
.form{display:flex;flex-direction:column;gap:12px;margin-top:20px;max-width:420px}
.form label{display:flex;flex-direction:column;gap:6px;font-weight:600}
.form input,.sel{font:inherit;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.sel{width:100%;margin:8px 0}
.msg{color:var(--bad);font-weight:600;min-height:1.2em}
.small{font-size:.8rem;color:var(--muted);max-width:65ch}
.note{background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:12px 14px;margin-top:16px}
.link-btn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-decoration:underline}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 6px}
.board{list-style:none;padding:0;margin:16px 0;display:flex;flex-direction:column;gap:8px}
.board li{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.board li.me{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.board .rk{font-family:var(--mono);font-weight:700;font-size:1.1rem;text-align:center}
.board .pn small{display:block;color:var(--muted);font-size:.78rem}
.board .pv{font-family:var(--mono);font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums}
.board .pv small{color:var(--muted);font-size:.7rem;margin-left:3px}
.h2{font-family:var(--display);font-size:1.15rem;margin:24px 0 10px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.badge{display:flex;gap:10px;align-items:center;border:1px dashed var(--line);border-radius:10px;padding:10px;opacity:.45;filter:grayscale(1)}
.badge.on{opacity:1;filter:none;border-style:solid;border-color:var(--accent);background:var(--surface)}
.badge span{font-size:1.8rem}.badge small{display:block;color:var(--muted);font-size:.78rem}
.danger{color:var(--bad);border-color:var(--bad)}
.foot a{color:var(--accent);font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;max-width:90vw;z-index:9}

/* Style La Chaîne des Quiz (violet et orange) */
h1{font-weight:800;letter-spacing:-.03em}
.block{border-radius:22px;padding:18px 20px;box-shadow:0 14px 34px -24px rgba(60,40,180,.4)}
.num{border-radius:14px}
.block.mined .num{background:linear-gradient(150deg,#7b61ff,var(--accent))}
.btn{border-radius:999px;padding:11px 20px;box-shadow:0 10px 22px -12px var(--accent)}
.ghost{border-radius:999px;background:var(--surface)}
.chip{border-radius:999px}
.opt{border-radius:16px;padding:15px 16px}
.fb,.lesson,.note{border-radius:18px}
.bar{height:8px}
.bar i{background:linear-gradient(90deg,var(--accent),#ff9214)}
.link.ok{border-left-color:var(--accent)}
.score{background:linear-gradient(90deg,var(--accent),#ff9214);-webkit-background-clip:text;background-clip:text;color:transparent}
.score small{-webkit-text-fill-color:var(--muted)}
</style>
</head>

<div class="wrap" id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://tokenforgefan.github.io/chaine-des-quiz/commun.js"></script>
<script>
const PASS=15, TOTAL=20, PTS_OK=1, PTS_KO=-0.5;
const fmt=n=>String(Math.round(n*2)/2).replace(".",",");
const LEVELS=[{"id":"s1","title":"Introduction à la blockchain et au Web3","src":"Session 1 · support PDF et vidéos"},{"id":"s2","title":"Bitcoin et monnaie numérique","src":"Q&R n°2 · Garrick Hileman"},{"id":"s3","title":"Blockchains programmables : Cardano et Ethereum","src":"Q&R n°3 · John Greene, Cardano Foundation"},{"id":"s4","title":"Sécurité et confidentialité des portefeuilles","src":"Q&R n°4 · Lucien, Trezor"},{"id":"s5","title":"Finance décentralisée (DeFi)","src":"Session 5 · support PDF, tutoriels et Q&R n°5 · Luke Martinez, Avalanche Team1"},{"id":"s6","title":"Les marchés prédictifs","src":"Session 6 · support PDF, vidéo Polymarket et Q&R n°6 · Apostolos Kourtis"},{"id":"s7","title":"La géopolitique des cryptomonnaies","src":"Session 7 · cours de Garrick Hileman et 7 articles de recherche"},{"id":"s8","title":"Tokenisation et stablecoins","src":"Session 8 · support PDF, tutoriel RWA.xyz, cours préenregistré et Q&R avec Ripple"}];
const COURSE={
s1:[
{t:"Registre distribué et nœuds",q:[0,4,5,11],b:"Une blockchain est un registre que des milliers d'ordinateurs, les nœuds, conservent en copie. Chaque nœud vérifie lui-même les règles et rejette ce qui est invalide. C'est ce qui règle le problème de la double dépense sans banque : tout le monde voit la même liste de transactions dans le même ordre. Une blockchain publique est ouverte à tous ; une blockchain permissionnée réserve la validation à des participants choisis.",e:"Tu envoies 1 BTC à Paul puis, une seconde après, le même BTC à Marie. Les nœuds n'accepteront qu'une seule des deux transactions dans un bloc ; l'autre sera rejetée comme double dépense.",k:"Pas de chef : la vérité, c'est ce que la majorité des nœuds honnêtes accepte selon les mêmes règles."},
{t:"Hachage et chaînage des blocs",q:[1,2,3,13],b:"Une fonction de hachage (SHA-256 pour Bitcoin) transforme n'importe quelle donnée en une empreinte de taille fixe. Changer un seul caractère donne une empreinte totalement différente : c'est l'effet avalanche. Chaque bloc contient l'empreinte du précédent, donc toucher un vieux bloc casse tous les suivants. Réécrire l'historique demanderait de refaire tout ce travail plus vite que le reste du réseau : l'immuabilité est une question de coût, pas une impossibilité absolue.",e:"SHA-256(\"bonjour\") et SHA-256(\"Bonjour\") n'ont aucun caractère en commun dans le même ordre, alors qu'une seule majuscule change.",k:"Hash du bloc précédent dans chaque bloc = une chaîne où toute falsification se voit."},
{t:"Clés et signatures",q:[6,7],b:"Ton portefeuille repose sur une paire de clés. La clé privée, secrète, sert à signer ; la clé publique, dont dérive ton adresse, permet à chacun de vérifier la signature. Une signature valide prouve deux choses : que le détenteur de la clé privée a autorisé la transaction et que celle-ci n'a pas été modifiée. Elle ne dit rien de ton identité civile.",e:"Comme un cachet de cire unique : tout le monde peut reconnaître ton cachet sur l'enveloppe, mais toi seul possèdes le tampon.",k:"Clé privée = signer. Clé publique = vérifier. Qui a la clé privée a les fonds."},
{t:"Consensus : preuve de travail et preuve d'enjeu",q:[9,10,12],b:"Le consensus décide qui ajoute le prochain bloc. En preuve de travail (Bitcoin depuis le bloc genèse du 3 janvier 2009), les mineurs essaient des milliards de valeurs jusqu'à trouver un hash sous une cible : tricher coûte de l'électricité. En preuve d'enjeu (Ethereum depuis 2022, Cardano), les validateurs bloquent des jetons qu'ils peuvent perdre s'ils trichent : la sécurité vient du capital engagé.",e:"Miner, c'est comme lancer des dés jusqu'à faire un score très bas. Valider en PoS, c'est déposer une caution qu'on perd si on triche.",k:"PoW = sécurité par l'énergie. PoS = sécurité par l'argent mis en jeu."},
{t:"Contrats intelligents et oracles",q:[14,15],b:"Un contrat intelligent est un programme déployé sur la blockchain qui s'exécute tout seul quand ses conditions sont remplies, sans intermédiaire. Mais une blockchain ne voit pas le monde extérieur : pour connaître un prix ou un résultat, elle a besoin d'un oracle, un service qui y injecte ces données. L'oracle devient alors un point de confiance à surveiller.",e:"Une assurance retard de vol : l'oracle transmet l'heure réelle d'arrivée, et le contrat te rembourse automatiquement si le retard dépasse 3 heures.",k:"Le contrat exécute ; l'oracle informe. Un mauvais oracle donne un mauvais résultat."},
{t:"Jetons : Web3, NFT et stablecoins",q:[8,16,17],b:"Le Web1 permettait de lire, le Web2 de lire et publier, le Web3 ajoute la propriété : tu détiens tes actifs via tes clés. Les jetons prennent plusieurs formes. Un NFT est non fongible : chaque jeton est unique. Un stablecoin suit la valeur d'un actif de référence, souvent le dollar, et sa stabilité dépend des réserves ou du mécanisme qui le soutient.",e:"1 USDC s'échange contre n'importe quel autre USDC (fongible). Un billet de concert numéroté en NFT ne vaut pas forcément le billet voisin.",k:"Fongible = interchangeable. Stablecoin = arrimé à un actif, donc dépendant de ses réserves."},
{t:"Passer à l'échelle",q:[18,19],b:"Le trilemme dit qu'il est difficile d'avoir à la fois décentralisation, sécurité et scalabilité. Augmenter la taille des blocs rend les nœuds plus coûteux, donc moins nombreux. Les couches 2 contournent le problème : elles traitent les transactions hors de la chaîne principale et n'y règlent que le résultat, en profitant de sa sécurité.",e:"Lightning pour Bitcoin, ou les rollups comme Arbitrum et Base pour Ethereum, regroupent des milliers d'opérations en un seul règlement sur la couche 1.",k:"Couche 1 = sécurité et règlement. Couche 2 = débit et faibles frais."}
],
s2:[
{t:"La politique monétaire de Bitcoin",q:[0,1,2,5,19],b:"L'offre totale est plafonnée à 21 millions de BTC. Les nouveaux bitcoins sont créés comme subvention de bloc versée aux mineurs, et cette subvention est divisée par deux tous les 210 000 blocs, environ tous les quatre ans : c'est le halving. Depuis avril 2024 elle est de 3,125 BTC. Le mineur touche en plus les frais des transactions incluses, qui devront à terme financer seuls la sécurité. La plus petite unité est le satoshi, un cent-millionième de BTC.",e:"50 → 25 → 12,5 → 6,25 → 3,125 BTC par bloc. Le prochain halving, attendu vers 2028, la fera passer à 1,5625 BTC.",k:"21 millions, halving tous les 210 000 blocs, 1 BTC = 100 000 000 satoshis."},
{t:"Blocs, difficulté et confirmations",q:[3,4,8],b:"Bitcoin vise un bloc toutes les 10 minutes en moyenne. Tous les 2016 blocs, environ deux semaines, la difficulté s'ajuste : elle monte si les blocs sont venus trop vite, baisse s'ils ont été trop lents. Chaque bloc ajouté au-dessus de ta transaction est une confirmation ; plus il y en a, plus l'annuler est improbable. Six confirmations, environ une heure, est la référence historique pour un gros montant.",e:"Si la puissance de minage double, les blocs arrivent toutes les 5 minutes pendant un temps, puis la difficulté double et on revient à 10 minutes.",k:"10 min par bloc, ajustement tous les 2016 blocs, 6 confirmations pour être tranquille."},
{t:"Frais et mempool",q:[6,7],b:"Les transactions en attente patientent dans le mempool. La place dans un bloc est limitée, alors les mineurs choisissent celles qui paient le plus par unité de taille (sat/vB). Les frais dépendent donc du poids de la transaction en données et de l'encombrement du moment, pas du montant envoyé.",e:"Envoyer 0,001 BTC ou 10 BTC peut coûter les mêmes frais. En revanche, une transaction qui rassemble 50 petites entrées pèse lourd et coûte cher.",k:"On paie la place dans le bloc, pas la somme. Mempool chargé = frais plus élevés."},
{t:"Qu'est-ce que la monnaie ?",q:[10,11,12],b:"Une monnaie remplit trois fonctions : moyen d'échange, unité de compte et réserve de valeur. L'euro est une monnaie fiduciaire : sa valeur repose sur la confiance dans l'émetteur et sur son cours légal, pas sur de l'or. Le récit de Bitcoin « or numérique » s'appuie sur sa rareté programmée et vérifiable par tous, ce qui en fait surtout un candidat à la réserve de valeur.",e:"Depuis 1971, le dollar n'est plus convertible en or. Personne ne peut en revanche créer plus de 21 millions de BTC, et chacun peut le vérifier avec son nœud.",k:"Monnaie = échange, compte, réserve. Bitcoin se joue surtout sur la réserve de valeur."},
{t:"Adoption : histoire, États et finance",q:[9,13,14,15],b:"Le 22 mai 2010, 10 000 BTC achètent deux pizzas : premier achat connu en bitcoin. En 2021 le Salvador en fait une monnaie légale, statut assoupli en 2025 avec le FMI. En janvier 2024, les ETF bitcoin au comptant sont autorisés aux États-Unis, ouvrant la porte aux institutions. À l'opposé, les CBDC comme l'euro numérique sont des monnaies numériques émises et contrôlées par une banque centrale.",e:"Un ETF bitcoin s'achète sur un compte-titres comme une action, sans gérer de clé privée, mais sans en avoir la garde.",k:"CBDC = numérique mais centralisé. ETF = exposition au BTC sans détenir les clés."},
{t:"Lightning et confidentialité",q:[16,17],b:"Le Lightning Network permet des paiements rapides et quasi gratuits : deux parties ouvrent un canal sur la chaîne, échangent hors chaîne autant qu'elles veulent, puis règlent le solde. Côté vie privée, Bitcoin est pseudonyme et non anonyme : toutes les transactions sont publiques et l'analyse de chaîne peut relier une adresse à une personne, notamment via les plateformes avec KYC.",e:"Retirer d'un exchange vérifié vers ton adresse relie cette adresse à ton identité. Tout ce qui en sort ensuite devient traçable.",k:"Lightning = vitesse. Bitcoin = pseudonyme, jamais anonyme par défaut."},
{t:"Évolution du protocole : les forks",q:[18],b:"Un soft fork resserre les règles en restant compatible : les anciens nœuds continuent d'accepter les nouveaux blocs. Un hard fork change les règles de façon incompatible : si une partie du réseau refuse, la chaîne se scinde en deux.",e:"SegWit (2017) et Taproot (2021) sont des soft forks. Bitcoin Cash est né d'un hard fork en août 2017.",k:"Soft = compatible. Hard = incompatible, risque de scission."}
],
s3:[
{t:"Ethereum : EVM et gas",q:[0,1,2,10],b:"Ethereum, conçu par Vitalik Buterin et lancé en 2015, est un ordinateur mondial. L'EVM exécute le code des contrats de façon identique sur tous les nœuds. Chaque opération consomme du gas, payé en ETH : plus le contrat calcule, plus la transaction coûte, ce qui empêche les boucles infinies. Depuis The Merge, en septembre 2022, Ethereum fonctionne en preuve d'enjeu, avec une consommation électrique réduite de plus de 99 %.",e:"Un simple envoi d'ETH coûte 21 000 gas. Un échange sur Uniswap en coûte plusieurs fois plus, car le contrat fait bien plus de calculs.",k:"EVM = la machine. Gas = le carburant payé pour chaque calcul."},
{t:"Cardano : origines et méthode",q:[3,7,8,11,19],b:"Cardano a été fondé par Charles Hoskinson, cofondateur d'Ethereum. Sa particularité est son appui sur la recherche académique : les protocoles sont publiés et relus par des pairs avant d'être codés, au prix d'un rythme plus lent. Les contrats s'écrivent en Plutus, basé sur Haskell, un langage fonctionnel adapté à la vérification formelle. La Cardano Foundation, basée à Zoug, travaille sur l'adoption et la gouvernance. La plus petite unité est le lovelace.",e:"1 ADA = 1 000 000 lovelace, en hommage à Ada Lovelace, pionnière de la programmation.",k:"Cardano = recherche d'abord, code ensuite. Haskell/Plutus pour la sûreté."},
{t:"Modèle à comptes contre UTXO et eUTXO",q:[5,6,13],b:"Ethereum tient des comptes avec un solde, comme une banque. Bitcoin utilise des UTXO : des « pièces » qu'on dépense entièrement en récupérant la monnaie. Cardano étend ce modèle (eUTXO) pour y attacher du code et des données. Avantage pratique : on sait avant d'envoyer si la transaction réussira et combien elle coûtera. Sur Cardano, les jetons sont natifs, gérés par le registre sans contrat intelligent, alors que sur Ethereum un jeton ERC-20 est un contrat.",e:"Tu as une pièce de 5 € pour payer 3 € : tu la donnes entière et reçois 2 € de monnaie. C'est exactement ce que fait une transaction UTXO.",k:"Comptes = soldes (Ethereum). UTXO/eUTXO = pièces (Bitcoin, Cardano), résultats prévisibles."},
{t:"Preuve d'enjeu et délégation",q:[4,9],b:"Cardano utilise Ouroboros, une famille de protocoles de preuve d'enjeu publiés avec des preuves de sécurité. Les détenteurs d'ADA délèguent à un pool de staking sans rien bloquer : les ADA restent dans ton portefeuille, sous ta garde, et tu peux les dépenser à tout moment.",e:"Tu délègues 1 000 ADA à un pool : tu reçois des récompenses à chaque époque (5 jours) et tes 1 000 ADA ne quittent jamais ton portefeuille.",k:"Staking sur Cardano = liquide et sans perte de garde."},
{t:"Gouvernance on-chain",q:[12,15],b:"Une DAO est une organisation dont les règles et les votes passent par des contrats intelligents : les détenteurs de jetons votent, le code applique. Cardano a fait de la gouvernance un pilier avec l'ère Voltaire et la CIP-1694, qui introduit le vote on-chain et les représentants délégués (DReps).",e:"Sans voter toi-même chaque proposition, tu peux confier ton pouvoir de vote à un DRep dont tu partages les idées.",k:"DAO = votes exécutés par le code. Voltaire = gouvernance décentralisée de Cardano."},
{t:"DeFi et ses risques",q:[14,16,17,18],b:"La DeFi reproduit des services financiers (prêts, échanges, épargne) avec des contrats intelligents, sans intermédiaire. Les protocoles s'assemblent comme des briques : c'est la composabilité. Revers de la médaille : une faille dans le code peut être exploitée et les fonds volés, comme lors du piratage de The DAO en 2016. Les ponts entre blockchains concentrent d'énormes montants et une logique complexe, d'où des vols record comme Ronin (environ 600 M$) ou Wormhole (environ 320 M$).",e:"Tu déposes des USDC sur Aave et utilises ton reçu de dépôt comme garantie ailleurs : pratique, mais une faille dans l'un des deux protocoles touche toute la chaîne.",k:"Composabilité = puissance et risques empilés. Audit et prudence avec les ponts."}
],
s4:[
{t:"La garde personnelle",q:[0,1,16],b:"« Not your keys, not your coins » : sur une plateforme, tu ne détiens qu'une créance, et si la plateforme fait faillite ou bloque les retraits, tes fonds sont pris avec elle. La garde personnelle consiste à détenir toi-même tes clés. On sépare usage et épargne : un portefeuille chaud, connecté, pour de petits montants courants, et un portefeuille froid, hors ligne, pour l'épargne.",e:"FTX en 2022 ou AscendEX en 2026 : les clients avaient des soldes affichés, mais pas les clés.",k:"Pas tes clés, pas tes cryptos. Peu sur le chaud, l'épargne au froid."},
{t:"La phrase de récupération",q:[2,3,4],b:"Les 12 ou 24 mots sont ton portefeuille : toutes tes clés en dérivent. Perdre l'appareil n'est pas grave si tu as la phrase ; quelqu'un qui obtient la phrase a tout. Elle se garde hors ligne, sur papier ou sur métal, jamais en photo, en e-mail ou dans le cloud. Aucun support légitime ne la demandera jamais, ni en entier ni en partie.",e:"Un faux « support Ledger » t'écrit pour « resynchroniser » ton portefeuille et demande tes mots : c'est toujours une arnaque.",k:"Ta phrase ne se tape jamais sur un ordinateur ou un téléphone, et ne se donne à personne."},
{t:"La passphrase",q:[5,6],b:"La passphrase, ou « 25e mot », s'ajoute à la phrase de récupération pour créer un portefeuille caché. Un voleur qui trouve les 24 mots n'accède qu'au portefeuille sans passphrase, qui peut servir de leurre. Mais elle n'est stockée nulle part : si tu l'oublies, les fonds du portefeuille caché sont perdus pour toujours. Elle se sauvegarde donc séparément de la phrase.",e:"Même phrase de 24 mots + passphrase « Lisbonne2026 » = un portefeuille. Avec « lisbonne2026 » en minuscule = un autre portefeuille, vide.",k:"Passphrase = protection contre le vol de la phrase, mais aucune récupération possible si oubliée."},
{t:"Shamir et multisig",q:[7,8,9],b:"Shamir (SLIP-39) découpe la sauvegarde d'une clé en parts : il en faut un nombre minimal, par exemple 2 sur 3, pour la reconstituer, et une part seule ne révèle rien. Le multisig va plus loin : plusieurs clés distinctes doivent signer chaque transaction, si bien que la clé complète n'existe jamais en un seul endroit. Les deux suppriment le point de défaillance unique.",e:"Multisig 2 sur 3 : une clé chez toi, une à la banque, une chez un proche. Un cambriolage ou une perte ne suffit ni à voler ni à perdre les fonds.",k:"Shamir = sauvegarde partagée d'une clé. Multisig = plusieurs clés qui signent."},
{t:"Le matériel et sa provenance",q:[10,11,15,18],b:"Un portefeuille matériel garde les clés privées dans une puce : il signe en interne et la clé ne sort jamais, même sur un ordinateur infecté. Encore faut-il que l'appareil soit sain : on l'achète chez le fabricant ou un revendeur officiel, et la phrase doit toujours être générée par l'appareil devant toi. Certains modèles comme le Coldcard fonctionnent sans câble (air-gapped), via carte microSD.",e:"Une boîte contenant une phrase déjà imprimée ou un appareil déjà initialisé : quelqu'un d'autre connaît la clé. On ne l'utilise pas.",k:"Source officielle, phrase générée par l'appareil, clé qui ne sort jamais."},
{t:"Arnaques à l'adresse et à la signature",q:[12,13,14,19],b:"Un malware peut remplacer l'adresse copiée sur ton ordinateur : seule l'adresse affichée sur l'écran du portefeuille matériel fait foi. L'empoisonnement d'adresse glisse dans ton historique une adresse qui ressemble à la tienne au début et à la fin. Les « drainers » te font signer une autorisation illimitée qui leur permet ensuite de vider tes jetons. Avant un gros envoi, une petite transaction de test confirme adresse et réseau.",e:"Ton historique montre bc1q7x…9kf2 et une adresse piégée bc1q7x…9kf2 envoyée par l'attaquant : le milieu diffère, d'où l'importance de vérifier l'adresse entière.",k:"Vérifie l'adresse entière sur l'écran de l'appareil, lis ce que tu signes, teste d'abord en petit."},
{t:"Confidentialité : son propre nœud",q:[17],b:"Sans nœud personnel, ton portefeuille interroge le serveur de quelqu'un d'autre pour connaître ton solde : ce serveur voit toutes tes adresses et peut les relier entre elles. Faire tourner ton propre nœud complet te permet de vérifier toi-même les règles et de ne rien révéler.",e:"Un nœud Bitcoin sur un mini-PC ou un Umbrel à la maison, relié à Sparrow ou à Trezor Suite.",k:"Ton nœud = tu vérifies toi-même et tu gardes tes adresses pour toi."}
],
s5:[
{t:"Ce qu'est la DeFi et sa pile",q:[0,1],b:"La DeFi, ce sont des services financiers ouverts, de pair à pair, exécutés par des contrats intelligents sur des blockchains publiques. Elle s'attaque aux deux piliers de la TradFi : la garde des actifs par un tiers et l'accès filtré par l'identité. Une application DeFi repose sur cinq couches : règlement (la blockchain et son actif natif), actifs (jetons), protocole (les contrats qui font le prêt ou l'échange), application (le site web) et agrégation (DeBank, Yearn). Chaque couche ajoute du confort et une dépendance de plus.",e:"Si le site d'Uniswap était bloqué demain, tu pourrais encore échanger en appelant directement ses contrats ou via un autre front-end : le site n'est qu'une porte.",k:"L'application, ce sont les contrats, pas le site web. Chaque couche ajoutée = une confiance de plus."},
{t:"Prêt surcollatéralisé et liquidation",q:[2,3,15,16],b:"En DeFi, on prête à des inconnus sans score de crédit ni tribunal. Le collatéral remplace tout cela : on dépose plus que ce qu'on emprunte. Si sa valeur baisse sous le seuil du protocole, un robot liquide une partie de la garantie, avec une pénalité, pour rembourser le prêteur. Sur Aave, cet état se lit dans le facteur de santé : sous 1, la position est liquidable. Le dépôt donne un aToken, le reçu qui permet de retirer ses fonds.",e:"5 ETH à 3 000 $ (15 000 $) contre 10 000 USDC : ratio 150 %. Seuil 120 % = 12 000 $ de garantie, donc liquidation dès 2 400 $ l'ETH.",k:"Prix de liquidation = dette × seuil ÷ quantité de collatéral. Surveille ton facteur de santé et garde de la marge."},
{t:"Oracles, prêts flash et gouvernance",q:[4,5,6],b:"Un contrat ne voit que sa propre chaîne : il lit les prix via un oracle (Chainlink pour Aave V3). Si le marché lui-même est manipulé, l'oracle transmet fidèlement un faux prix, comme chez Mango Markets. Le prêt flash prête n'importe quel montant sans garantie, à condition d'être remboursé dans la même transaction, sinon tout est annulé. Utile pour l'arbitrage ou refinancer un prêt, il a aussi servi à acheter des votes : Beanstalk a perdu 182 M$ quand un prêt flash a acheté 79 % de la gouvernance.",e:"Un délai de 48 heures entre le vote et son exécution aurait suffi à neutraliser l'attaque de Beanstalk : un prêt flash ne survit pas au-delà d'une transaction.",k:"Oracle juste + marché truqué = prix faux. Prêt flash = capital géant pour une seule transaction, sans risque de défaut."},
{t:"Carnet d'ordres, pools et x · y = k",q:[7,8,9],b:"Sur une blockchain, chaque ordre coûte du gas et reste visible avant confirmation : les carnets d'ordres y sont chers et vides. Les DEX utilisent donc des pools de liquidité et un teneur de marché automatisé. Le plus courant garde constant le produit des réserves, x · y = k. Le prix est le rapport des réserves : chaque échange le déplace, d'autant plus que l'échange est gros et le pool petit.",e:"Pool 100 ETH / 300 000 USDC. Alice vend 10 ETH : il reste 30 000 000 ÷ 110 = 272 727 USDC. Elle reçoit 27 273 $ (2 727 $ par ETH) et le pool affiche 2 479 $.",k:"Prix = réserve de USDC ÷ réserve d'ETH. Gros échange ou petit pool = fort glissement."},
{t:"La perte impermanente",q:[10,11,12],b:"Le pool ne connaît pas le prix extérieur : quand l'ETH monte ailleurs, des arbitragistes rachètent au pool l'ETH trop bon marché jusqu'à l'égalité. Le LP a vendu son jeton gagnant. Par rapport à la simple détention, il perd selon la formule 2√r ÷ (1 + r) − 1, où r est le multiple du prix : −2 % pour ×1,5, −5,7 % pour ×2 ou ×½, −25,5 % pour ×5. Elle reste sur le papier tant qu'on reste dans le pool. Les paires stables y échappent presque, d'où les pools de Curve.",e:"60 000 $ déposés moitié ETH moitié USDC. L'ETH double : le LP a 84 853 $ (+41 %) mais en aurait eu 90 000 $ en gardant simplement ses jetons.",k:"Perte impermanente = ce que l'arbitragiste gagne. Fournir de la liquidité ne paie que si les frais la dépassent."},
{t:"Fournir de la liquidité en pratique",q:[13,14],b:"Sur Uniswap v3, on fournit une paire de jetons, on choisit un palier de frais (0,01 %, 0,05 %, 0,3 % ou 1 %) et une plage de prix. Paire stable et très liquide : frais minimes ; petits jetons exotiques : frais élevés acceptés ; 0,3 % pour la plupart des paires. La liquidité concentrée rapporte plus par dollar, mais hors de la plage la position ne touche plus rien et ne contient presque plus qu'un seul jeton. Chaque position est un NFT, et chaque jeton doit être approuvé séparément.",e:"Une étude de 17 pools Uniswap v3 : 199,3 M$ de frais encaissés, mais 260,1 M$ de perte impermanente. Les LP ont fait 60,8 M$ de moins que s'ils avaient gardé leurs jetons.",k:"Palier de frais adapté à la volatilité, plage surveillée, et toujours comparer au simple fait de garder ses jetons."},
{t:"Staking liquide et sortie",q:[18],b:"Le staking liquide met tes jetons en staking et te donne un reçu échangeable : stETH chez Lido pour l'ETH, sAVAX chez BENQI pour l'AVAX. Tes jetons continuent de rapporter et le reçu peut servir de garantie ailleurs : rendement empilé, risque empilé. Pour sortir, deux routes : la rédemption par le protocole, lente (sAVAX : 15 jours d'attente puis 2 jours pour réclamer), ou la vente sur le marché, rapide mais au prix des acheteurs présents.",e:"Tu stakes 100 AVAX, reçois du sAVAX, l'utilises comme collatéral pour emprunter. Si l'AVAX chute, tu cumules perte de valeur, risque de liquidation et sortie lente.",k:"Un jeton de staking liquide est une créance sur des jetons stakés, pas un ticket de sortie instantanée."},
{t:"Quand la DeFi casse",q:[17,19],b:"La DeFi casse rarement par la blockchain elle-même : par un bug de contrat, un oracle trompé, une gouvernance achetée, des clés d'administration ou de pont compromises, un stablecoin qui décroche, ou un utilisateur piégé. Depuis 2024, les attaquants visent surtout les clés et les personnes (Bybit, 1,5 Md$). La composabilité propage aussi les chocs : quand SVB a fait faillite, l'USDC est tombé à 0,86 $ et le DAI, garanti à 36 % par de l'USDC, l'a suivi.",e:"Avril 2026, Kelp DAO : un pont à vérificateur unique accepte un faux message, les rsETH volés servent de garantie sur Aave pour emprunter de l'ETH réel. Un seul maillon faible a touché un autre protocole.",k:"Remonte toutes les dépendances : ta position n'est jamais plus sûre que ce qu'elle empile."}
],
s6:[
{t:"Le prix comme probabilité",q:[0,1,7],b:"Un contrat OUI paie 1 $ si la condition est remplie, 0 $ sinon ; le NON paie l'inverse. Le prix du OUI, entre 0 et 1 $, se lit comme une probabilité implicite du marché. C'est une approximation : peu d'échanges, frais, aversion au risque ou délai avant règlement l'écartent de la vraie probabilité. On peut revendre à tout moment avant la fin. Sur Polymarket, la probabilité affichée est le milieu entre la meilleure offre d'achat (bid) et de vente (ask).",e:"Bid 17 ¢, ask 18 ¢ : Polymarket affiche 18 %. Un OUI acheté 18 ¢ rapporte 82 ¢ si l'événement arrive (+456 %). Acheté 0,30 et revendu 0,45 : +0,15 $ quel que soit le résultat.",k:"Le prix est une estimation. Les règles sont le contrat."},
{t:"Sagesse des foules, sondage et bookmaker",q:[2,3,5],b:"En 1906, la médiane des estimations de 800 visiteurs d'une foire sur le poids d'un bœuf tombe à moins de 1 % du poids réel, mieux que chaque expert : agréger beaucoup de petits savoirs annule les erreurs. Un sondage, lui, interroge un échantillon pondéré et mesure une intention. Un marché mesure ce que les traders acceptent de risquer sur l'issue : sans incitation financière à être précis, ce n'est qu'un sondage. Il diffère aussi d'un bookmaker : chez ce dernier, on parie contre la maison qui fixe les cotes avec sa marge et bannit les gagnants ; sur un marché, les prix viennent des échanges entre traders et la plateforme vit des frais.",e:"52 % des intentions de vote et 80 % de chances de gagner peuvent être justes tous les deux : ce ne sont pas les mêmes questions.",k:"Sondage = ce que les gens comptent faire. Marché = ce que les traders risquent."},
{t:"Arbitrage et usages",q:[4,6],b:"Une paire OUI + NON paie toujours exactement 1 $. Si elle coûte moins, l'acheter verrouille un gain sans risque : l'arbitrage garde les prix cohérents. Les usages : prévoir (élections, taux, sport), se couvrir contre un événement précis, évaluer une politique, éclairer les décisions d'entreprise (HP a battu ses prévisions officielles 6 fois sur 8), rassembler une information dispersée. Qui paie pour le chiffre décide si c'est une prévision, une couverture ou un casino.",e:"Un festival perd 40 000 $ s'il pleut. 10 000 OUI « pluie » à 25 ¢ coûtent 2 500 $ et rapportent 10 000 $ s'il pleut : couverture partielle.",k:"OUI + NON = 1 $. Un marché prédictif peut servir d'assurance."},
{t:"Carnet d'ordres ou AMM",q:[8,9],b:"Le carnet d'ordres (CLOB) apparie acheteurs et vendeurs selon le prix puis l'heure : écarts serrés quand beaucoup de monde échange, mais vide sur les petits marchés. Le teneur de marché automatisé (AMM) cote toujours un prix par formule ; le LMSR de Hanson est subventionné par un sponsor. Il subit du glissement sur les gros ordres, et ce sont les fournisseurs de liquidité qui perdent face aux traders informés. Le volume compte les échanges ; l'intérêt ouvert, les contrats encore détenus. Un pic de volume signale souvent une nouvelle information, un intérêt ouvert qui grimpe de l'argent frais ; un spread large, un marché peu liquide.",e:"Kalshi et Polymarket utilisent un carnet d'ordres ; Omen, Augur ou les marchés internes d'entreprise, un AMM.",k:"Une rue pleine veut un carnet d'ordres, une rue vide a besoin d'un commerçant."},
{t:"Centralisé contre décentralisé",q:[10,12,15],b:"Une plateforme centralisée demande de lui faire confiance : elle garde les fonds, peut geler les retraits ou limiter les gagnants, décide seule du résultat, bloque certains pays et choisit les questions. Un marché décentralisé remplace l'opérateur par des contrats intelligents et un oracle, et règle en stablecoins pour que le prix ne reflète que la probabilité. Kalshi : bourse américaine réglementée par la CFTC, KYC, dollars. Polymarket : USDC, accès mondial pseudonyme, création de marché contre caution (~750 USDC). Plus de 90 % du volume passe aujourd'hui par le centralisé.",e:"Avec de l'ETH comme collatéral, un pari gagnant pourrait être effacé par une chute de l'ETH. L'USDC évite ce mélange.",k:"Kalshi = régulé et centralisé. Polymarket = pseudonyme, USDC, oracle."},
{t:"L'oracle et la résolution",q:[11,13,14],b:"Une blockchain ne connaît pas le monde réel : l'oracle lui dit qui a gagné, et le contrat paie en conséquence. Cycle de vie : création, négociation, résolution (rapport de l'oracle puis période de contestation), règlement. Polymarket utilise l'oracle optimiste d'UMA : un résultat proposé avec caution est accepté sauf contestation ; après deux contestations, les détenteurs du jeton UMA votent. Si l'oracle se trompe sans être contesté, les vrais gagnants perdent sans recours.",e:"Mai 2026, « MicroStrategy vendra-t-elle du bitcoin d'ici le 31 mai ? » (60 M$ de volume) : deux contestations, vote UMA, résultat NON. La vente, bien réelle, n'a été publiée qu'un jour plus tard.",k:"Le contrat garde l'argent ; l'oracle décide qui le touche."},
{t:"Polymarket sous le capot",q:[16,17,18],b:"Polymarket est hybride : le carnet d'ordres tourne hors chaîne pour la vitesse, les fonds et le règlement sont on-chain. Cliquer « acheter » crée un ordre signé avec ta clé privée (norme EIP-712) contenant le jeton, le sens, le prix et la taille ; le carnet vérifie la signature et les fonds. Tout ordre est en fait un ordre limité. Un événement regroupe plusieurs marchés binaires. Le site web reste un point faible centralisé, comme l'a montré le piratage de fin octobre 2026.",e:"Un script tiers du site, compromis via son DNS, a vendu les positions des utilisateurs connectés grâce aux autorisations déjà accordées. Aucune clé volée, aucun bug de contrat.",k:"Hors chaîne pour la vitesse, on-chain pour la confiance, et le site web comme talon d'Achille."},
{t:"Délit d'initié et manipulation",q:[19],b:"Avec une information non publique, on peut parier avant la nouvelle. À court terme, le prix devient plus juste ; à long terme, les traders mal informés fuient (sélection adverse) et le marché perd liquidité et précision. Le pseudonymat facilite aussi les attaques Sybil (une personne, des centaines de comptes) et le wash trading. Les marchés peu actifs ou faciles à influencer sont les plus exposés, et une prédiction peut même influencer l'événement (réflexivité).",e:"Affaire Maduro (janvier 2026) : probabilité à 9 %, des comptes créés juste avant, ne pariant que sur le Venezuela, avec un sans-faute ; six portefeuilles transforment 9 800 $ en 133 000 $.",k:"Si les initiés dominent, la confiance et la liquidité s'en vont."}
],
s7:[
{t:"Cryptoactif, cryptomonnaie et fonctions de la monnaie",q:[0, 1, 2],b:"Un cryptoactif se détient comme un lingot ; une cryptomonnaie sert à payer, comme le dollar et Visa réunis. Les fonctions de la monnaie s'emboîtent : réserve de valeur (le plus large), moyen d'échange, puis unité de compte au cœur. Bitcoin est surtout à la première étape. La monnaie actuelle est déjà largement privée : les banques commerciales la créent en prêtant, les banques centrales n'en émettent souvent pas 10 %. Hayek imaginait des monnaies privées en concurrence où la plus stable gagnerait ; en pratique, beaucoup préfèrent détenir ce qui peut monter.",e:"Ton crédit immobilier de 200 000 € n'existait pas avant la signature : la banque l'a créé en l'inscrivant sur ton compte.",k:"Réserve de valeur → moyen d'échange → unité de compte. C'est comme monnaie qu'une crypto pèserait vraiment sur la géopolitique."},
{t:"Volatilité et confiance",q:[3, 18],b:"Pour Nick Szabo, la volatilité de Bitcoin vient d'une incertitude réelle sur son avenir, que plus de liquidité ne supprime pas. Elle a aidé à l'attention et à l'adoption, mais elle empêche d'afficher des prix au quotidien. L'histoire des monnaies alternatives est rude : la plupart meurent vite, surtout par manque de demande, plus rarement interdites par un régulateur. Exemple d'interdiction : la monnaie « fondante » de Wörgl (Autriche, 1932), qui perdait 1 % par mois pour pousser à dépenser.",e:"Beenz et flooz, nées de la bulle internet, ont disparu sans interdiction : personne n'en voulait assez.",k:"Le vrai juge d'une monnaie, c'est la demande, avant le régulateur."},
{t:"Ce qui pourrait en faire une monnaie",q:[15, 19],b:"Plusieurs moteurs peuvent porter une crypto du statut d'or numérique à celui de monnaie : l'économie pair-à-pair, une nouvelle crise financière (Minsky), le réalignement des monnaies de réserve qu'annonce Eichengreen, la disparition du cash (Rogoff). Hayek avait anticipé la concurrence des monnaies privées, en pensant que la plus stable gagnerait ; or le leader, Bitcoin, l'emporte par sa rareté plus que par sa stabilité. Le moteur préféré de Hileman : l'économie machine-à-machine, où IA et robots ont besoin d'une monnaie native, programmable et sans gardien.",e:"Un agent IA qui loue de la puissance de calcul seconde par seconde ne peut ni ouvrir un compte bancaire ni passer un contrôle Visa ; il peut détenir une clé et payer en sats ou en USDC.",k:"D'abord réserve de valeur, puis moyen d'échange : les machines pourraient être les premiers vrais utilisateurs quotidiens."},
{t:"Le dollar, la Fed et la Chine",q:[5, 13],b:"Au lendemain des droits de douane d'avril 2025, Hileman pose la question de l'indépendance de la Fed : continuera-t-elle à prêter des dollars aux autres banques centrales en crise via des lignes de swap ? Un dollar transformé en arme pousse à chercher des alternatives. Face à la Chine, ce sont les États-Unis, société ouverte, qui ont adopté Bitcoin les premiers, avec une réserve nourrie par les BTC saisis. Un actif décentralisé gêne un système financier contrôlé.",e:"En 2008 et en 2020, la Fed a ouvert des lignes de swap quasi illimitées à la BCE et à la Banque du Japon pour éviter l'effondrement de leurs banques.",k:"Celui qui contrôle l'accès au dollar tient un levier géopolitique. Bitcoin s'accorde mieux avec une société ouverte."},
{t:"Les freins à l'adoption",q:[4, 6, 10],b:"Le plus grand obstacle : presque personne n'est payé en crypto, donc peu de commerçants l'acceptent, donc personne ne demande à l'être. S'ajoutent la complexité, le risque de perte, l'énergie, la concurrence des stablecoins, l'essoufflement possible du mouvement né de 2008, la concentration croissante de la détention (État américain, Saylor, BlackRock, Satoshi ~5 %) et le risque quantique : l'or repose sur la physique, Bitcoin sur les mathématiques.",e:"Un Gallois fouille une décharge depuis 10 ans pour retrouver le disque dur de ses 8 000 BTC : la perte est un vrai frein.",k:"Pas de salaires en crypto, pas de monnaie. Une monnaie doit circuler entre beaucoup de mains."},
{t:"Criminalité et transparence",q:[7, 8, 9],b:"Foley et al. estimaient qu'environ un quart des utilisateurs et 46 % des transactions bitcoin (≈ 76 Md$ par an) étaient illégaux, une part qui baisse avec l'adoption grand public et l'arrivée de Monero ou Zcash. Mais le registre est public : « Coins for Bombs » montre un volume anormal sur les exchanges non régulés et les mixeurs avant de grands attentats, assez pour en prédire certains un jour avant. Les saisies alimentent même la réserve bitcoin américaine.",e:"Le groupe nord-coréen Lazarus pirate des exchanges et blanchit via Tornado Cash ; l'analyse de chaîne suit pourtant une grande partie des fonds.",k:"Le criminel utilise la crypto, mais le registre public l'expose."},
{t:"Crypto, sanctions et valeur refuge",q:[11, 12, 14],b:"Bitcoin et l'or montent quand le risque géopolitique est élevé, mais l'effet dépend du type de risque et Bitcoin reste trop volatil pour être une valeur refuge établie. En Russie, après l'invasion de 2022 et le gel de 350 Md$ d'actifs, les particuliers se tournent vers l'USDT : plus de petites adresses, accumulation, retraits hors des exchanges. Quand l'UE inclut explicitement les services crypto dans ses sanctions, le trading sur les exchanges centralisés ralentit.",e:"Un Russe qui craint le rouble achète de l'USDT et le retire vers son propre portefeuille, hors de portée d'une plateforme sanctionnée.",k:"En crise, le stablecoin dollar sert de refuge et de sortie ; les sanctions mordent sur les plateformes centralisées."},
{t:"Mesurer : incertitude et motivations",q:[16, 17],b:"L'indice UCRY (Lucey et al.) mesure l'incertitude crypto à partir de 726,9 millions d'articles de presse, en deux volets : politique et prix. L'incertitude n'est pas la volatilité : elle bouge moins souvent mais dure plus longtemps. Auer (BRI) montre que les investisseurs américains ne sont pas plus méfiants que la moyenne envers les banques ou le cash : ils sont surtout jeunes, diplômés et spéculent.",e:"Un piratage d'exchange ou une élection fait grimper l'UCRY pendant des semaines, même si le prix se stabilise vite.",k:"Aux États-Unis, la crypto est surtout un pari, pas une fuite hors du système."}
],
s8:[
{t:"Ce qu'est la tokenisation",q:[0,1,2],b:"Tokeniser, c'est créer sur la blockchain une représentation d'un actif qui n'y est pas né : un dollar, une obligation, un immeuble. Un dépositaire prend le contrôle de l'actif, émet un jeton (fongible ou NFT), et peut le racheter à un taux fixe, souvent 1 pour 1, contre des frais. Dépositaire et détenteurs forment le marché primaire ; les détenteurs s'échangent ensuite les jetons sur le marché secondaire. La tokenisation est un spectre, du jeton miroir géré hors chaîne à l'actif entièrement régi par la chaîne.",e:"Tu déposes 100 $ chez Circle, qui émet 100 USDC (marché primaire). Tu revends ensuite 50 USDC à un ami contre de l'ETH (marché secondaire).",k:"Garde, émission, rachat : le jeton ne vaut que ce que le dépositaire garantit."},
{t:"Promesses et pièges",q:[3,4],b:"La tokenisation promet liquidité, accès fractionné, transparence, programmabilité, efficacité, composabilité DeFi et portée mondiale. Mais l'actif réel dépend d'un dépositaire hors chaîne : la confiance et la centralisation reviennent. S'ajoutent le risque de liquidité (pas d'acheteurs), la fragmentation des plateformes, l'incertitude réglementaire et la difficulté d'évaluer des actifs rares.",e:"Un jeton représentant 1/1000e d'un appartement s'échange en un clic, mais si personne n'en veut, tu ne le vendras qu'à prix cassé, voire pas du tout.",k:"Un jeton décentralisé peut cacher un actif très centralisé."},
{t:"Les chiffres et BUIDL",q:[5,6,7],b:"En 2026, les actifs réels tokenisés pèsent 38,8 milliards de dollars hors stablecoins, dont 15,7 milliards en bons du Trésor américain. Les stablecoins, 302,9 milliards, écrasent tout : 99,6 % des utilisateurs d'actifs tokenisés ont détenu un stablecoin. Le fonds BUIDL de BlackRock, via Securitize, est le symbole de la tokenisation institutionnelle : jeton à 1 $ qui verse le rendement des bons du Trésor, environ 2,8 milliards en août 2026, mais permissionné, donc quelques dizaines de détenteurs seulement.",e:"Sur RWA.xyz, l'onglet Treasuries montre un rendement moyen autour de 5 % et quelques milliers de détenteurs : il faut être vérifié pour y accéder.",k:"Le gros de la tokenisation, ce sont les dollars ; viennent ensuite le crédit privé et les bons du Trésor."},
{t:"Pourquoi des stablecoins",q:[8,9],b:"Une bonne monnaie est un moyen d'échange, une unité de compte et une réserve de valeur ; les trois reposent sur la stabilité. Les cryptos ont les qualités techniques (durables, divisibles, fongibles, transportables, infalsifiables) mais pas la stabilité. Le stablecoin veut les deux. Il suit souvent le dollar, jugé assez stable grâce à son rôle mondial, mais la stabilité est relative : le dollar a perdu l'essentiel de son pouvoir d'achat au XXe siècle.",e:"Un café affiché 2 USDC reste à 2 USDC toute la semaine ; affiché en BTC, son prix changerait chaque jour.",k:"Un stablecoin en dollars garde stable son prix en dollars, pas ton pouvoir d'achat."},
{t:"USDT et DAI : deux garanties",q:[10,11,12,13],b:"Les stablecoins se classent selon qui garde la garantie (centralisé ou non) et ce qui tient l'ancrage (actifs réels, cryptos, algorithme, mélange). USDT est entièrement garanti par des réserves chez Tether : simple, mais il faut croire Tether. DAI est surgaranti en ETH dans des coffres Maker (150 $ d'ETH pour 100 DAI) : décentralisé, mais inefficace en capital. En mars 2020, l'ETH a perdu environ 50 % en un jour : tout le monde voulait du DAI, personne ne pouvait en créer, et il est passé au-dessus de 1 $.",e:"Bob échange 1 $ contre 1 USDT chez Tether. Alice bloque 150 $ d'ETH pour emprunter 100 DAI ; si l'ETH chute trop, une partie est liquidée.",k:"USDT : confiance dans l'émetteur. DAI : confiance dans la garantie et le code."},
{t:"Les stablecoins algorithmiques",q:[14,15],b:"Deux jetons : le stablecoin visé à 1 $ et un jeton action à prix libre, convertibles l'un dans l'autre. Au-dessus de 1 $, on crée des stablecoins pour les vendre ; en dessous, on les rachète pour les détruire. Le jeton action est un pari sur l'écosystème : tout ne tient que si chacun croit que les deux gardent de la valeur. En 2022, UST a décroché ; pour le défendre, Terra a émis des montagnes de Luna, qui s'est effondré avec lui.",e:"UST à 0,90 $ : tu l'achètes et l'échanges contre 1 $ de Luna, 0,10 $ de gain. Mais si Luna s'effondre aussi, ce dollar de Luna ne vaut plus rien.",k:"Efficace en capital, mais adossé à de la confiance pure : risque de spirale."},
{t:"Les CBDC",q:[16,17,18],b:"Une CBDC est une monnaie numérique de banque centrale : de détail (ménages), de gros (banques) ou universelle (aussi les étrangers). 146 pays en explorent une, 3 en ont lancé une (mai 2026). Elles répondent à la politique monétaire, à l'essor des fintechs et à la souveraineté face aux cryptos et stablecoins. Choix de conception : nature, disponibilité, accès par jetons ou comptes, infrastructure DLT ou RTGS, distribution directe ou par les banques. Grand risque : en crise, les dépôts fuient vers la CBDC en un clic.",e:"Une panique type SVB : au lieu de faire la queue au guichet, les clients transfèrent tout vers leur portefeuille d'euro numérique en une minute.",k:"Plafonds, taux échelonnés et distribution par les banques limitent la désintermédiation."},
{t:"Dépôts tokenisés",q:[19],b:"Un dépôt tokenisé est la représentation sur blockchain d'un dépôt bancaire, émis par une banque régulée et couvert par ses dépôts. C'est un juste milieu : une créance sur une banque privée (pas sur la banque centrale comme une CBDC), sous le droit bancaire strict (pas sous des règles variables comme un stablecoin émis par une entreprise).",e:"Ta banque émet des « euros-jetons » qui représentent ton compte courant et circulent sur une blockchain, toujours protégés par le droit bancaire.",k:"Émetteur : banque centrale (CBDC), banque commerciale (dépôt tokenisé), entreprise (stablecoin)."}
]
};

// ===== Version communauté : comptes Supabase, correction serveur, classements =====
const sb=window.CDQ?CDQ.sb:null;
const SITE="https://tokenforgefan.github.io/quiz-blockchain/";
const HUB="https://tokenforgefan.github.io/chaine-des-quiz/";
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function fakeHash(id,score){let h=0;const s=id+score;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;let out="";for(let i=0;i<4;i++){h=(h*1103515245+12345)>>>0;out+=h.toString(16).padStart(8,"0").slice(0,4)}return "0000"+out.slice(0,12)}
const errMsg=e=>{const m=(e&&(e.message||e.error_description||e.msg))||String(e||"");
  if(/fetch|network|Failed/i.test(m))return "Pas de connexion internet. Le quiz communautaire a besoin d'internet pour corriger tes réponses.";
  if(/rate limit|too many/i.test(m))return "Trop de demandes d'e-mail d'un coup. Patiente quelques minutes puis réessaie.";
  if(/duplicate|unique/i.test(m))return "Ce pseudo est déjà pris, choisis-en un autre.";
  if(/check constraint|profiles_pseudo/i.test(m))return "Pseudo invalide : 3 à 20 caractères, lettres, chiffres, _ - . uniquement.";
  if(/expired|invalid.*token|otp/i.test(m))return "Code incorrect ou expiré. Redemande un code.";
  return m};

let ME=null;          // {id,email,pseudo}
let prog={};          // {s1:{best,passed}}
let QCACHE={};        // questions par bloc (sans réponses)
const unlocked=i=>i===0||(prog[LEVELS[i-1].id]&&prog[LEVELS[i-1].id].passed);

function busy(msg){app.innerHTML=`<p class="rule" style="margin-top:40px">${esc(msg||"Chargement…")}</p>`}

// ---------- Compte : géré par la page d'accueil ----------
function login(){ location.href = CDQ.loginUrl(); }
async function afterAuth(){
  ME = await CDQ.me();
  if(ME && !ME.pseudo){ ME = null; return login(); }
  await loadProgress(); home();
}
async function loadProgress(){prog={};if(!ME)return;
  const{data}=await sb.rpc("my_progress");(data||[]).forEach(r=>prog[r.level_id]={best:+r.best,passed:r.passed})}

// ---------- La chaîne ----------
function home(){
  const done=LEVELS.filter(l=>prog[l.id]&&prog[l.id].passed).length;
  CDQ.menu("quiz");
  let h=`<h1>Quiz à niveaux · Blockchain</h1>
  <p class="lede">Testez vos connaissances sur la blockchain et les actifs numériques. Chaque session est un bloc : suis d'abord son cours, puis passe le test pour le miner et débloquer le suivant. Grimpe dans le classement de la communauté !</p>
  <p class="rule">20 questions par bloc · il faut <b>au moins ${PASS}/20</b> pour passer · ${done}/${LEVELS.length} blocs minés</p>
  <p class="rule">Points négatifs : bonne réponse <b>+1</b> · mauvaise réponse <b>−0,5</b> · question passée <b>0</b>. Dans le doute, mieux vaut passer.</p>
  ${ME&&ME.pseudo?"":`<p class="note">👉 Les cours sont ouverts à tous. Pour passer les tests et entrer dans le classement, <a href="${CDQ.loginUrl()}">connecte-toi avec ton e-mail</a>.</p>`}
  <div class="chain">`;
  LEVELS.forEach((l,i)=>{
    const p=prog[l.id], open=unlocked(i), mined=p&&p.passed;
    if(i>0)h+=`<div class="link ${mined||unlocked(i)?"ok":""}" aria-hidden="true"></div>`;
    const cls=mined?"mined":open?"open":"locked";
    let chip=mined?`<span class="chip ok">Miné</span>`:open?(p?`<span class="chip ko">À repasser</span>`:`<span class="chip">Disponible</span>`):`<span class="chip">Verrouillé</span>`;
    let meta=mined?`hash ${fakeHash(l.id,p.best)} · meilleur score ${fmt(p.best)}/20`:open?(p?`meilleur score ${fmt(p.best)}/20 · encore ${fmt(PASS-p.best)} point${PASS-p.best>1?"s":""} à gagner`:l.src):`Réussis le bloc ${i} pour déverrouiller`;
    h+=`<div class="block ${cls}"><div class="num">${String(i+1).padStart(2,"0")}</div><div class="info">
      <h2>${esc(l.title)}</h2><div class="meta">${esc(meta)}</div>
      <div class="row">${chip}<button class="${mined||p?"ghost":"btn"}" data-learn="${i}">${p?"Revoir le cours":"1. Suivre le cours"}</button>${open?`<button class="${mined||!p?"ghost":"btn"}" data-go="${i}">${mined?"Rejouer le test":p?"Retenter le test":"2. Passer le test"}</button>`:""}</div></div></div>`;
  });
  h+=`</div><div class="foot"><span>Sur tablette : menu du navigateur → « Ajouter à l'écran d'accueil ».</span><a href="https://tokenforgefan.github.io/Arcade-blockchain/">🎮 Arcade-Blockchain</a></div>`;
  app.innerHTML=h;
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>start(+b.dataset.go));
  app.querySelectorAll("[data-learn]").forEach(b=>b.onclick=()=>lesson(+b.dataset.learn));
}

function lesson(i){
  const l=LEVELS[i],ns=COURSE[l.id]||[];
  let h=`<div class="top"><button class="ghost" id="quit">← Chaîne</button><span class="qnum">Bloc ${i+1} · Cours</span></div>
  <h1 style="margin-top:18px">${esc(l.title)}</h1><p class="rule">${esc(l.src)} · ${ns.length} leçons · ensuite, test de ${TOTAL} questions (+1 / −0,5 / 0 si passée, ${PASS}/20 pour réussir)</p>
  <div class="course">`;
  ns.forEach((n,k)=>{h+=`<section class="lesson"><span class="cnt">Leçon ${k+1}/${ns.length}</span><h3>${esc(n.t)}</h3><p>${esc(n.b)}</p>
    <p class="ex"><b>Exemple concret</b>${esc(n.e)}</p><p class="key"><b>À retenir</b>${esc(n.k)}</p></section>`});
  h+=`</div><div class="row" style="margin-top:20px"><button class="btn" id="go">J'ai appris le cours, passer le test →</button></div>`;
  app.innerHTML=h;window.scrollTo(0,0);
  document.getElementById("quit").onclick=home;
  document.getElementById("go").onclick=()=>start(i);
}

// ---------- Partie (corrigée par le serveur) ----------
let S=null;
async function start(i){
  if(!ME||!ME.pseudo)return login();
  if(!unlocked(i))return home();
  const l=LEVELS[i];busy("Préparation du bloc…");
  try{
    if(!QCACHE[l.id]){const{data,error}=await sb.rpc("get_questions",{p_level:l.id});if(error)throw error;QCACHE[l.id]=data}
    const{data:att,error}=await sb.rpc("start_attempt",{p_level:l.id});if(error)throw error;
    const qs=shuffle(QCACHE[l.id]).slice(0,TOTAL).map(q=>{const order=shuffle(q.options.map((_,k)=>k));return{q:q.prompt,o:order.map(k=>q.options[k]),order,ix:q.idx}});
    S={i,att,qs,n:0,score:0,good:0,bad:0,skip:0,miss:[]};ask();window.scrollTo(0,0);
  }catch(e){app.innerHTML=`<p class="msg">${esc(errMsg(e))}</p><button class="btn" id="b">← Chaîne</button>`;document.getElementById("b").onclick=home}
}
function ask(){
  const q=S.qs[S.n];
  app.innerHTML=`<div class="top"><button class="ghost" id="quit">← Quitter</button><span class="qnum">Bloc ${S.i+1} · Question ${S.n+1}/${S.qs.length} · ${fmt(S.score)} pt${Math.abs(S.score)>1?"s":""}</span></div>
  <div class="bar"><i style="width:${S.n/S.qs.length*100}%"></i></div>
  <p class="q">${esc(q.q)}</p>
  <div class="opts">${q.o.map((t,k)=>`<button class="opt" data-k="${k}"><span class="k">${"ABCDEF"[k]}</span><span>${esc(t)}</span></button>`).join("")}</div>
  <div class="next" style="justify-content:flex-start"><button class="ghost" id="skip">Je ne sais pas, passer (0 point)</button></div>
  <div id="fb"></div>`;
  document.getElementById("quit").onclick=()=>{S=null;home()};
  document.getElementById("skip").onclick=()=>answer(-1);
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
}
async function answer(k){
  const q=S.qs[S.n],skipped=k<0;
  app.querySelectorAll(".opt,#skip").forEach(b=>b.disabled=true);
  let r;
  try{const{data,error}=await sb.rpc("answer_question",{p_attempt:S.att,p_idx:q.ix,p_choice:skipped?null:q.order[k]});if(error)throw error;r=data}
  catch(e){document.getElementById("fb").innerHTML=`<p class="msg">${esc(errMsg(e))}</p><div class="next"><button class="btn" id="re">Réessayer</button></div>`;
    document.getElementById("re").onclick=()=>{app.querySelectorAll(".opt,#skip").forEach(b=>b.disabled=false);document.getElementById("fb").innerHTML=""};return}
  const right=q.order.indexOf(r.answer),ok=r.ok;q.a=right;q.e=r.explanation;
  if(ok){S.score+=PTS_OK;S.good++}else if(skipped){S.skip++;S.miss.push({...q,you:null})}else{S.score+=PTS_KO;S.bad++;S.miss.push({...q,you:q.o[k]})}
  app.querySelectorAll(".opt").forEach((b,j)=>{if(j===right)b.classList.add("right");else if(j===k)b.classList.add("wrong")});
  const last=S.n===S.qs.length-1;
  const head=ok?"Bonne réponse · +1":skipped?"Question passée · 0 point":"Mauvaise réponse · −0,5";
  document.getElementById("fb").innerHTML=`<div class="fb ${ok?"ok":"ko"}"><strong>${head}</strong>${esc(r.explanation)}</div>
  <div class="next"><button class="btn" id="nx">${last?"Voir mon score":"Question suivante →"}</button></div>`;
  const nx=document.getElementById("nx");nx.focus();
  nx.onclick=()=>{if(last)finish();else{S.n++;ask()}};
}
function courseHTML(id,miss){
  if(!miss.length)return `<div class="course"><h2>Mini-cours</h2><p>Aucune erreur ni question passée : rien à revoir sur ce bloc.</p></div>`;
  const groups=(COURSE[id]||[]).map(n=>({n,items:miss.filter(m=>n.q.includes(m.ix))})).filter(g=>g.items.length).sort((a,b)=>b.items.length-a.items.length);
  let h=`<div class="course"><h2>Mini-cours sur tes erreurs</h2><p>${groups.length} notion${groups.length>1?"s":""} à revoir, de la plus ratée à la moins ratée.</p>`;
  groups.forEach(g=>{const c=g.items.length;
    h+=`<section class="lesson"><span class="cnt">${c} question${c>1?"s":""} ratée${c>1?"s":""} ou passée${c>1?"s":""}</span><h3>${esc(g.n.t)}</h3>
    <p>${esc(g.n.b)}</p><p class="ex"><b>Exemple concret</b>${esc(g.n.e)}</p><p class="key"><b>À retenir</b>${esc(g.n.k)}</p>
    <details><summary>Tes questions sur cette notion (${c})</summary><div class="qa">${g.items.map(m=>`<div><p>${esc(m.q)}</p>${m.you?`<p class="you">Ta réponse : ${esc(m.you)}</p>`:`<p class="you">Question passée</p>`}<p class="a">Bonne réponse : ${esc(m.o[m.a])}</p></div>`).join("")}</div></details></section>`});
  return h+`</div>`;
}
async function finish(){
  const l=LEVELS[S.i];busy("Calcul du score par le serveur…");
  let r;try{const{data,error}=await sb.rpc("finish_attempt",{p_attempt:S.att});if(error)throw error;r=data}
  catch(e){app.innerHTML=`<p class="msg">${esc(errMsg(e))}</p><button class="btn" id="re">Réessayer</button>`;document.getElementById("re").onclick=finish;return}
  const final=+r.score,pass=r.passed;await loadProgress();
  const nextOpen=pass&&S.i+1<LEVELS.length,gap=PASS-final;
  let h=`<div class="top"><span class="qnum">Bloc ${S.i+1} · ${esc(l.title)}</span></div>
  <div style="margin-top:24px" class="score">${fmt(final)}<small>/20</small></div>
  <p class="qnum" style="margin:10px 0 0">${r.correct} bonne${r.correct>1?"s":""} (+${r.correct}) · ${r.wrong} fausse${r.wrong>1?"s":""} (−${fmt(r.wrong*0.5)}) · ${r.skipped} passée${r.skipped>1?"s":""} · score vérifié par le serveur</p>
  <p class="verdict">${pass?(nextOpen?`Bloc miné. Le bloc ${S.i+2} est déverrouillé.`:`Bloc miné. Tu as terminé toute la chaîne disponible.`):`Il te manque ${fmt(gap)} point${gap>1?"s":""} pour miner ce bloc. Relis les corrections ci-dessous puis retente.`}</p>
  <div class="row">${nextOpen?`<button class="btn" id="nxt">Bloc suivant →</button>`:""}<button class="${pass?"ghost":"btn"}" id="again">Retenter ce bloc</button><button class="ghost" id="share">📣 Partager mon résultat</button><button class="ghost" id="lb">🏆 Classement</button><button class="ghost" id="map">Voir la chaîne</button></div>`;
  h+=courseHTML(l.id,S.miss);
  app.innerHTML=h;window.scrollTo(0,0);
  const i=S.i;
  const n=document.getElementById("nxt");if(n)n.onclick=()=>start(i+1);
  document.getElementById("again").onclick=()=>start(i);
  document.getElementById("map").onclick=home;
  document.getElementById("lb").onclick=()=>location.href=HUB+"#classement?onglet=level&bloc="+l.id;
  document.getElementById("share").onclick=()=>shareCard(i,final,pass);
}

// ---------- Carte de résultat partageable ----------
async function shareCard(i,score,pass){
  const l=LEVELS[i],c=document.createElement("canvas");c.width=c.height=1080;const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,1080,1080);g.addColorStop(0,"#0f1716");g.addColorStop(1,"#2a1d06");x.fillStyle=g;x.fillRect(0,0,1080,1080);
  x.strokeStyle="#e2a23b";x.lineWidth=6;x.strokeRect(50,50,980,980);
  x.fillStyle="#e2a23b";x.font="700 44px system-ui,sans-serif";x.fillText("⛓ LA CHAÎNE DES QUIZ",100,160);
  x.fillStyle="#e4ecea";x.font="500 40px system-ui,sans-serif";
  const words=("Bloc "+(i+1)+" · "+l.title).split(" ");let line="",y=260;
  words.forEach(w=>{if(x.measureText(line+w).width>860){x.fillText(line,100,y);line="";y+=54}line+=w+" "});x.fillText(line,100,y);
  x.fillStyle=pass?"#5fcf94":"#f08178";x.font="800 260px system-ui,sans-serif";x.fillText(fmt(score),100,640);const sw=x.measureText(fmt(score)).width;
  x.fillStyle="#93a3a0";x.font="600 80px system-ui,sans-serif";x.fillText("/20",120+sw,640);
  x.fillStyle="#e4ecea";x.font="700 56px system-ui,sans-serif";x.fillText(pass?"✅ Bloc miné !":"⛏ En cours de minage…",100,780);
  x.fillStyle="#93a3a0";x.font="500 38px system-ui,sans-serif";x.fillText("par "+(ME&&ME.pseudo||""),100,860);
  x.fillStyle="#e2a23b";x.font="600 34px ui-monospace,monospace";x.fillText(SITE.replace("https://",""),100,960);
  const text=`J'ai fait ${fmt(score)}/20 au bloc ${i+1} « ${l.title} » de la Chaîne des Quiz${pass?" et je l'ai miné ⛏":""}. À toi de jouer : ${SITE}`;
  const blob=await new Promise(r=>c.toBlob(r,"image/png"));
  const file=new File([blob],"resultat-quiz.png",{type:"image/png"});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text});return}}catch(e){if(e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="resultat-quiz.png";a.click();
  try{await navigator.clipboard.writeText(text);alertBox("Image téléchargée, et texte copié : colle-le avec l'image sur ton réseau.")}catch(e){alertBox("Image téléchargée.")}
}
function alertBox(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),4000)}

// ---------- Démarrage ----------
(async()=>{
  if(!sb){CDQ&&CDQ.menu&&CDQ.menu("quiz");app.innerHTML=`<p class="msg">Impossible de charger le module de connexion. Vérifie ta connexion internet puis recharge la page.</p>`;return}
  busy();
  try{await afterAuth()}catch(e){home()}
})();

</script>
