{t:"Fournir de la liquidité en pratique",q:[13,14],b:"Sur Uniswap v3, on fournit une paire de jetons, on choisit un palier de frais (0,01 %, 0,05 %, 0,3 % ou 1 %) et une plage de prix. Paire stable et très liquide : frais minimes ; petits jetons exotiques : frais élevés acceptés ; 0,3 % pour la plupart des paires. La liquidité concentrée rapporte plus par dollar, mais hors de la plage la position ne touche plus rien et ne contient presque plus qu'un seul jeton. Chaque position est un NFT, et chaque jeton doit être approuvé séparément.",e:"Une étude de 17 pools Uniswap v3 : 199,3 M$ de frais encaissés, mais 260,1 M$ de perte impermanente. Les LP ont fait 60,8 M$ de moins que s'ils avaient gardé leurs jetons.",k:"Palier de frais adapté à la volatilité, plage surveillée, et toujours comparer au simple fait de garder ses jetons."},
{t:"Staking liquide et sortie",q:[18],b:"Le staking liquide met tes jetons en staking et te donne un reçu échangeable : stETH chez Lido pour l'ETH, sAVAX chez BENQI pour l'AVAX. Tes jetons continuent de rapporter et le reçu peut servir de garantie ailleurs : rendement empilé, risque empilé. Pour sortir, deux routes : la rédemption par le protocole, lente (sAVAX : 15 jours d'attente puis 2 jours pour réclamer), ou la vente sur le marché, rapide mais au prix des acheteurs présents.",e:"Tu stakes 100 AVAX, reçois du sAVAX, l'utilises comme collatéral pour emprunter. Si l'AVAX chute, tu cumules perte de valeur, risque de liquidation et sortie lente.",k:"Un jeton de staking liquide est une créance sur des jetons stakés, pas un ticket de sortie instantanée."},
{t:"Quand la DeFi casse",q:[17,19],b:"La DeFi casse rarement par la blockchain elle-même : par un bug de contrat, un oracle trompé, une gouvernance achetée, des clés d'administration ou de pont compromises, un stablecoin qui décroche, ou un utilisateur piégé. Depuis 2024, les attaquants visent surtout les clés et les personnes (Bybit, 1,5 Md$). La composabilité propage aussi les chocs : quand SVB a fait faillite, l'USDC est tombé à 0,86 $ et le DAI, garanti à 36 % par de l'USDC, l'a suivi.",e:"Avril 2026, Kelp DAO : un pont à vérificateur unique accepte un faux message, les rsETH volés servent de garantie sur Aave pour emprunter de l'ETH réel. Un seul maillon faible a touché un autre protocole.",k:"Remonte toutes les dépendances : ta position n'est jamais plus sûre que ce qu'elle empile."}
],
s6:[
{t:"Le prix comme probabilité",q:[0,1,7],b:"Un contrat OUI paie 1 $ si la condition est remplie, 0 $ sinon ; le NON paie l'inverse. Le prix du OUI, entre 0 et 1 $, se lit comme une probabilité implicite du marché. C'est une approximation : peu d'échanges, frais, aversion au risque ou délai avant règlement l'écartent de la vraie probabilité. On peut revendre à tout moment avant la fin. Sur Polymarket, la probabilité affichée est le milieu entre la meilleure offre d'achat (bid) et de vente (ask).",e:"Bid 17 ¢, ask 18 ¢ : Polymarket affiche 18 %. Un OUI acheté 18 ¢ rapporte 82 ¢ si l'événement arrive (+456 %). Acheté 0,30 et revendu 0,45 : +0,15 $ quel que soit le résultat.",k:"Le prix est une estimation. Les règles sont le contrat."},
{t:"Sagesse des foules, sondage et bookmaker",q:[2,3,5],b:"En 1906, la médiane des estimations de 800 visiteurs d'une foire sur le poids d'un bœuf tombe à moins de 1 % du poids réel, mieux que chaque expert : agréger beaucoup de petits savoirs annule les erreurs. Un sondage, lui, interroge un échantillon pondéré et mesure une intention. Un marché mesure ce que les traders acceptent de risquer sur l'issue : sans incitation financière à être précis, ce n'est qu'un sondage. Il diffère aussi d'un bookmaker : chez ce dernier, on parie contre la maison qui fixe les cotes avec sa marge et bannit les gagnants ; sur un marché, les prix viennent des échanges entre traders et la plateforme vit des frais.",e:"52 % des intentions de vote et 80 % de chances de gagner peuvent être justes tous les deux : ce ne sont pas les mêmes questions.",k:"Sondage = ce que les gens comptent faire. Marché = ce que les traders risquent."},
{t:"Arbitrage et usages",q:[4,6],b:"Une paire OUI + NON paie toujours exactement 1 $. Si elle coûte moins, l'acheter verrouille un gain sans risque : l'arbitrage garde les prix cohérents. Les usages : prévoir (élections, taux, sport), se couvrir contre un événement précis, évaluer une politique, éclairer les décisions d'entreprise (HP a battu ses prévisions officielles 6 fois sur 8), rassembler une information dispersée. Qui paie pour le chiffre décide si c'est une prévision, une couverture ou un casino.",e:"Un festival perd 40 000 $ s'il pleut. 10 000 OUI « pluie » à 25 ¢ coûtent 2 500 $ et rapportent 10 000 $ s'il pleut : couverture partielle.",k:"OUI + NON = 1 $. Un marché prédictif peut servir d'assurance."},
{t:"Carnet d'ordres ou AMM",q:[8,9],b:"Le carnet d'ordres (CLOB) apparie acheteurs et vendeurs selon le prix puis l'heure : écarts serrés quand beaucoup de monde échange, mais vide sur les petits marchés. Le teneur de marché automatisé (AMM) cote toujours un prix par formule ; le LMSR de Hanson est subventionné par un sponsor. Il subit du glissement sur les gros ordres, et ce sont les fournisseurs de liquidité qui perdent face aux traders informés. Le volume compte les échanges ; l'intérêt ouvert, les contrats encore détenus. Un pic de volume signale souvent une nouvelle information, un intérêt ouvert qui grimpe de l'argent frais ; un spread large, un marché peu liquide.",e:"Kalshi et Polymarket utilisent un carnet d'ordres ; Omen, Augur ou les marchés internes d'entreprise, un AMM.",k:"Une rue pleine veut un carnet d'ordres, une rue vide a besoin d'un commerçant."},
{t:"Centralisé contre décentralisé",q:[10,12,15],b:"Une plateforme centralisée demande de lui faire confiance : elle garde les fonds, peut geler les retraits ou limiter les gagnants, décide seule du résultat, bloque certains pays et choisit les questions. Un marché décentralisé remplace l'opérateur par des contrats intelligents et un oracle, et règle en stablecoins pour que le prix ne reflète que la probabilité. Kalshi : bourse américaine réglementée par la CFTC, KYC, dollars. Polymarket : USDC, accès mondial pseudonyme, création de marché contre caution (~750 USDC). Plus de 90 % du volume passe aujourd'hui par le centralisé.",e:"Avec de l'ETH comme collatéral, un pari gagnant pourrait être effacé par une chute de l'ETH. L'USDC évite ce mélange.",k:"Kalshi = régulé et centralisé. Polymarket = pseudonyme, USDC, oracle."},
{t:"L'oracle et la résolution",q:[11,13,14],b:"Une blockchain ne connaît pas le monde réel : l'oracle lui dit qui a gagné, et le contrat paie en conséquence. Cycle de vie : création, négociation, résolution (rapport de l'oracle puis période de contestation), règlement. Polymarket utilise l'oracle optimiste d'UMA : un résultat proposé avec caution est accepté sauf contestation ; après deux contestations, les détenteurs du jeton UMA votent. Si l'oracle se trompe sans être contesté, les vrais gagnants perdent sans recours.",e:"Mai 2026, « MicroStrategy vendra-t-elle du bitcoin d'ici le 31 mai ? » (60 M$ de volume) : deux contestations, vote UMA, résultat NON. La vente, bien réelle, n'a été publiée qu'un jour plus tard.",k:"Le contrat garde l'argent ; l'oracle décide qui le touche."},
{t:"Polymarket sous le capot",q:[16,17,18],b:"Polymarket est hybride : le carnet d'ordres tourne hors chaîne pour la vitesse, les fonds et le règlement sont on-chain. Cliquer « acheter » crée un ordre signé avec ta clé privée (norme EIP-712) contenant le jeton, le sens, le prix et la taille ; le carnet vérifie la signature et les fonds. Tout ordre est en fait un ordre limité. Un événement regroupe plusieurs marchés binaires. Le site web reste un point faible centralisé, comme l'a montré le piratage de fin octobre 2026.",e:"Un script tiers du site, compromis via son DNS, a vendu les positions des utilisateurs connectés grâce aux autorisations déjà accordées. Aucune clé volée, aucun bug de contrat.",k:"Hors chaîne pour la vitesse, on-chain pour la confiance, et le site web comme talon d'Achille."},
{t:"Délit d'initié et manipulation",q:[19],b:"Avec une information non publique, on peut parier avant la nouvelle. À court terme, le prix devient plus juste ; à long terme, les traders mal informés fuient (sélection adverse) et le marché perd liquidité et précision. Le pseudonymat facilite aussi les attaques Sybil (une personne, des centaines de comptes) et le wash trading. Les marchés peu actifs ou faciles à influencer sont les plus exposés, et une prédiction peut même influencer l'événement (réflexivité).",e:"Affaire Maduro (janvier 2026) : probabilité à 9 %, des comptes créés juste avant, ne pariant que sur le Venezuela, avec un sans-faute ; six portefeuilles transforment 9 800 $ en 133 000 $.",k:"Si les initiés dominent, la confiance et la liquidité s'en vont."}
],
s7:[
{t:"Cryptoactif, cryptomonnaie et fonctions de la monnaie",q:[0, 1, 2],b:"Un cryptoactif se détient comme un lingot ; une cryptomonnaie sert à payer, comme le dollar et Visa réunis. Les fonctions de la monnaie s'emboîtent : réserve de valeur (le plus large), moyen d'échange, puis unité de compte au cœur. Bitcoin est surtout à la première étape. La monnaie actuelle est déjà largement privée : les banques commerciales la créent en prêtant, les banques centrales n'en émettent souvent pas 10 %. Hayek imaginait des monnaies privées en concurrence où la plus stable gagnerait ; en pratique, beaucoup préfèrent détenir ce qui peut monter.",e:"Ton crédit immobilier de 200 000 € n'existait pas avant la signature : la banque l'a créé en l'inscrivant sur ton compte.",k:"Réserve de valeur → moyen d'échange → unité de compte. C'est comme monnaie qu'une crypto pèserait vraiment sur la géopolitique."},
{t:"Volatilité et confiance",q:[3, 18],b:"Pour Nick Szabo, la volatilité de Bitcoin vient d'une incertitude réelle sur son avenir, que plus de liquidité ne supprime pas. Elle a aidé à l'attention et à l'adoption, mais elle empêche d'afficher des prix au quotidien. L'histoire des monnaies alternatives est rude : la plupart meurent vite, surtout par manque de demande, plus rarement interdites par un régulateur. Exemple d'interdiction : la monnaie « fondante » de Wörgl (Autriche, 1932), qui perdait 1 % par mois pour pousser à dépenser.",e:"Beenz et flooz, nées de la bulle internet, ont disparu sans interdiction : personne n'en voulait assez.",k:"Le vrai juge d'une monnaie, c'est la demande, avant le régulateur."},
{t:"Ce qui pourrait en faire une monnaie",q:[15, 19],b:"Plusieurs moteurs peuvent porter une crypto du statut d'or numérique à celui de monnaie : l'économie pair-à-pair, une nouvelle crise financière (Minsky), le réalignement des monnaies de réserve qu'annonce Eichengreen, la disparition du cash (Rogoff). Hayek avait anticipé la concurrence des monnaies privées, en pensant que la plus stable gagnerait ; or le leader, Bitcoin, l'emporte par sa rareté plus que par sa stabilité. Le moteur préféré de Hileman : l'économie machine-à-machine, où IA et robots ont besoin d'une monnaie native, programmable et sans gardien.",e:"Un agent IA qui loue de la puissance de calcul seconde par seconde ne peut ni ouvrir un compte bancaire ni passer un contrôle Visa ; il peut détenir une clé et payer en sats ou en USDC.",k:"D'abord réserve de valeur, puis moyen d'échange : les machines pourraient être les premiers vrais utilisateurs quotidiens."},
{t:"Le dollar, la Fed et la Chine",q:[5, 13],b:"Au lendemain des droits de douane d'avril 2025, Hileman pose la question de l'indépendance de la Fed : continuera-t-elle à prêter des dollars aux autres banques centrales en crise via des lignes de swap ? Un dollar transformé en arme pousse à chercher des alternatives. Face à la Chine, ce sont les États-Unis, société ouverte, qui ont adopté Bitcoin les premiers, avec une réserve nourrie par les BTC saisis. Un actif décentralisé gêne un système financier contrôlé.",e:"En 2008 et en 2020, la Fed a ouvert des lignes de swap quasi illimitées à la BCE et à la Banque du Japon pour éviter l'effondrement de leurs banques.",k:"Celui qui contrôle l'accès au dollar tient un levier géopolitique. Bitcoin s'accorde mieux avec une société ouverte."},
{t:"Les freins à l'adoption",q:[4, 6, 10],b:"Le plus grand obstacle : presque personne n'est payé en crypto, donc peu de commerçants l'acceptent, donc personne ne demande à l'être. S'ajoutent la complexité, le risque de perte, l'énergie, la concurrence des stablecoins, l'essoufflement possible du mouvement né de 2008, la concentration croissante de la détention (État américain, Saylor, BlackRock, Satoshi ~5 %) et le risque quantique : l'or repose sur la physique, Bitcoin sur les mathématiques.",e:"Un Gallois fouille une décharge depuis 10 ans pour retrouver le disque dur de ses 8 000 BTC : la perte est un vrai frein.",k:"Pas de salaires en crypto, pas de monnaie. Une monnaie doit circuler entre beaucoup de mains."},
{t:"Criminalité et transparence",q:[7, 8, 9],b:"Foley et al. estimaient qu'environ un quart des utilisateurs et 46 % des transactions bitcoin (≈ 76 Md$ par an) étaient illégaux, une part qui baisse avec l'adoption grand public et l'arrivée de Monero ou Zcash. Mais le registre est public : « Coins for Bombs » montre un volume anormal sur les exchanges non régulés et les mixeurs avant de grands attentats, assez pour en prédire certains un jour avant. Les saisies alimentent même la réserve bitcoin américaine.",e:"Le groupe nord-coréen Lazarus pirate des exchanges et blanchit via Tornado Cash ; l'analyse de chaîne suit pourtant une grande partie des fonds.",k:"Le criminel utilise la crypto, mais le registre public l'expose."},
{t:"Crypto, sanctions et valeur refuge",q:[11, 12, 14],b:"Bitcoin et l'or montent quand le risque géopolitique est élevé, mais l'effet dépend du type de risque et Bitcoin reste trop volatil pour être une valeur refuge établie. En Russie, après l'invasion de 2022 et le gel de 350 Md$ d'actifs, les particuliers se tournent vers l'USDT : plus de petites adresses, accumulation, retraits hors des exchanges. Quand l'UE inclut explicitement les services crypto dans ses sanctions, le trading sur les exchanges centralisés ralentit.",e:"Un Russe qui craint le rouble achète de l'USDT et le retire vers son propre portefeuille, hors de portée d'une plateforme sanctionnée.",k:"En crise, le stablecoin dollar sert de refuge et de sortie ; les sanctions mordent sur les plateformes centralisées."},
{t:"Mesurer : incertitude et motivations",q:[16, 17],b:"L'indice UCRY (Lucey et al.) mesure l'incertitude crypto à partir de 726,9 millions d'articles de presse, en deux volets : politique et prix. L'incertitude n'est pas la volatilité : elle bouge moins souvent mais dure plus longtemps. Auer (BRI) montre que les investisseurs américains ne sont pas plus méfiants que la moyenne envers les banques ou le cash : ils sont surtout jeunes, diplômés et spéculent.",e:"Un piratage d'exchange ou une élection fait grimper l'UCRY pendant des semaines, même si le prix se stabilise vite.",k:"Aux États-Unis, la crypto est surtout un pari, pas une fuite hors du système."}
]
};

const KEY="chaine-quiz-v1";
let prog={};
try{prog=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){prog={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(prog))}catch(e){}}
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function fakeHash(id,score){let h=0;const s=id+score;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;let out="";for(let i=0;i<4;i++){h=(h*1103515245+12345)>>>0;out+=h.toString(16).padStart(8,"0").slice(0,4)}return "0000"+out.slice(0,12)}
const unlocked=i=>i===0||(prog[LEVELS[i-1].id]&&prog[LEVELS[i-1].id].passed);
let confirmReset=false;

function home(){
  const done=LEVELS.filter(l=>prog[l.id]&&prog[l.id].passed).length;
  let h=`<h1>La Chaîne des Quiz</h1>
  <p class="lede">Testez vos connaissances sur la blockchain et les actifs numériques à travers un quiz interactif et ludique. Découvrez les concepts clés, les cryptomonnaies, les NFT et les enjeux de cette nouvelle révolution numérique ! Chaque session est un bloc : réussis son quiz pour le miner et débloquer le suivant.</p>
  <p class="rule">20 questions par bloc · il faut <b>au moins ${PASS}/20</b> (plus de 14) pour passer · ${done}/${LEVELS.length} blocs minés</p>
  <p class="rule">Points négatifs : bonne réponse <b>+1</b> · mauvaise réponse <b>−0,5</b> · question passée <b>0</b>. Dans le doute, mieux vaut passer.</p>
  <div class="chain">`;
  LEVELS.forEach((l,i)=>{
    const p=prog[l.id], open=unlocked(i), mined=p&&p.passed;
    if(i>0)h+=`<div class="link ${mined||unlocked(i)?"ok":""}" aria-hidden="true"></div>`;
    const cls=mined?"mined":open?"open":"locked";
    let chip=mined?`<span class="chip ok">Miné</span>`:open?(p?`<span class="chip ko">À repasser</span>`:`<span class="chip">Disponible</span>`):`<span class="chip">Verrouillé</span>`;
    let meta=mined?`hash ${fakeHash(l.id,p.best)} · meilleur score ${fmt(p.best)}/20`:open?(p?`meilleur score ${fmt(p.best)}/20 · encore ${fmt(PASS-p.best)} point${PASS-p.best>1?"s":""} à gagner`:l.src):`Réussis le bloc ${i} pour déverrouiller`;
    h+=`<div class="block ${cls}"><div class="num">${String(i+1).padStart(2,"0")}</div><div class="info">
      <h2>${esc(l.title)}</h2><div class="meta">${esc(meta)}</div>
      <div class="row">${chip}${open?`<button class="${mined?"ghost":"btn"}" data-go="${i}">${mined?"Rejouer":p?"Retenter":"Commencer"}</button>`:""}</div></div></div>`;
  });
  h+=`</div><div class="foot"><span>Ta progression est gardée dans ce navigateur.</span>
  <span class="confirm">${confirmReset?`Tout effacer ? <button class="ghost" id="yes">Oui, effacer</button><button class="ghost" id="no">Annuler</button>`:`<button class="ghost" id="reset">Réinitialiser</button>`}</span></div>`;
  app.innerHTML=h;
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>start(+b.dataset.go));
  const r=document.getElementById("reset");if(r)r.onclick=()=>{confirmReset=true;home()};
  const y=document.getElementById("yes");if(y)y.onclick=()=>{prog={};save();confirmReset=false;home()};
  const n=document.getElementById("no");if(n)n.onclick=()=>{confirmReset=false;home()};
}

let S=null;
function start(i){
  const l=LEVELS[i];
  const qs=shuffle(l.qs.map((q,ix)=>[q,ix])).slice(0,TOTAL).map(([q,ix])=>{const order=shuffle([0,1,2,3]);return{q:q[0],o:order.map(k=>q[1][k]),a:order.indexOf(q[2]),e:q[3],ix}});
  S={i,qs,n:0,score:0,good:0,bad:0,skip:0,miss:[]};
  ask();window.scrollTo(0,0);
}
function ask(){
  const l=LEVELS[S.i],q=S.qs[S.n];
  app.innerHTML=`<div class="top"><button class="ghost" id="quit">← Quitter</button><span class="qnum">Bloc ${S.i+1} · Question ${S.n+1}/${TOTAL} · ${fmt(S.score)} pt${Math.abs(S.score)>1?"s":""}</span></div>
  <div class="bar"><i style="width:${S.n/TOTAL*100}%"></i></div>
  <p class="q">${esc(q.q)}</p>
  <div class="opts">${q.o.map((t,k)=>`<button class="opt" data-k="${k}"><span class="k">${"ABCD"[k]}</span><span>${esc(t)}</span></button>`).join("")}</div>
  <div class="next" style="justify-content:flex-start"><button class="ghost" id="skip">Je ne sais pas, passer (0 point)</button></div>
  <div id="fb"></div>`;
  document.getElementById("quit").onclick=home;
  document.getElementById("skip").onclick=()=>answer(-1);
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  app.querySelector(".opt").focus({preventScroll:true});
}
function answer(k){
  const q=S.qs[S.n],ok=k===q.a,skipped=k<0;
  if(ok){S.score+=PTS_OK;S.good++}else if(skipped){S.skip++;S.miss.push({...q,you:null})}else{S.score+=PTS_KO;S.bad++;S.miss.push({...q,you:q.o[k]})}
  app.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add("right");else if(j===k)b.classList.add("wrong")});
  document.getElementById("skip").disabled=true;
  const last=S.n===TOTAL-1;
  const head=ok?"Bonne réponse · +1":skipped?"Question passée · 0 point":"Mauvaise réponse · −0,5";
  document.getElementById("fb").innerHTML=`<div class="fb ${ok?"ok":"ko"}"><strong>${head}</strong>${esc(q.e)}</div>
  <div class="next"><button class="btn" id="nx">${last?"Voir mon score":"Question suivante →"}</button></div>`;
  const nx=document.getElementById("nx");nx.focus();
  nx.onclick=()=>{if(last)finish();else{S.n++;ask()}};
}
function courseHTML(id,miss){
  if(!miss.length)return `<div class="course"><h2>Mini-cours</h2><p>Aucune erreur ni question passée : rien à revoir sur ce bloc.</p></div>`;
  const groups=(COURSE[id]||[]).map(n=>({n,items:miss.filter(m=>n.q.includes(m.ix))})).filter(g=>g.items.length).sort((a,b)=>b.items.length-a.items.length);
  let h=`<div class="course"><h2>Mini-cours sur tes erreurs</h2><p>${groups.length} notion${groups.length>1?"s":""} à revoir, de la plus ratée à la moins ratée. Lis la leçon, puis vérifie tes questions en dessous.</p>`;
  groups.forEach(g=>{
    const c=g.items.length;
    h+=`<section class="lesson"><span class="cnt">${c} question${c>1?"s":""} ratée${c>1?"s":""} ou passée${c>1?"s":""}</span><h3>${esc(g.n.t)}</h3>
    <p>${esc(g.n.b)}</p>
    <p class="ex"><b>Exemple concret</b>${esc(g.n.e)}</p>
    <p class="key"><b>À retenir</b>${esc(g.n.k)}</p>
    <details><summary>Tes questions sur cette notion (${c})</summary><div class="qa">${g.items.map(m=>`<div><p>${esc(m.q)}</p>${m.you?`<p class="you">Ta réponse : ${esc(m.you)}</p>`:`<p class="you">Question passée</p>`}<p class="a">Bonne réponse : ${esc(m.o[m.a])}</p></div>`).join("")}</div></details></section>`;
  });
  return h+`</div>`;
}
function finish(){
  const l=LEVELS[S.i],final=Math.max(0,S.score),pass=final>=PASS,p=prog[l.id]||{best:0,passed:false};
  p.best=Math.max(p.best,final);p.passed=p.passed||pass;prog[l.id]=p;save();
  const nextOpen=pass&&S.i+1<LEVELS.length,gap=PASS-final;
  let h=`<div class="top"><span class="qnum">Bloc ${S.i+1} · ${esc(l.title)}</span></div>
  <div style="margin-top:24px" class="score">${fmt(final)}<small>/20</small></div>
  <p class="qnum" style="margin:10px 0 0">${S.good} bonne${S.good>1?"s":""} (+${S.good}) · ${S.bad} fausse${S.bad>1?"s":""} (−${fmt(S.bad*0.5)}) · ${S.skip} passée${S.skip>1?"s":""}</p>
  <p class="verdict">${pass?(nextOpen?`Bloc miné. Le bloc ${S.i+2} est déverrouillé.`:`Bloc miné. Tu as terminé toute la chaîne disponible.`):`Il te manque ${fmt(gap)} point${gap>1?"s":""} pour miner ce bloc. Relis les corrections ci-dessous puis retente.`}</p>
  <div class="row">${nextOpen?`<button class="btn" id="nxt">Bloc suivant →</button>`:""}<button class="${pass?"ghost":"btn"}" id="again">Retenter ce bloc</button><button class="ghost" id="map">Voir la chaîne</button></div>`;
  h+=courseHTML(l.id,S.miss);
  if(S.miss.length)h+=`<div class="row" style="margin-top:20px">${nextOpen?`<button class="btn" id="nxt2">Bloc suivant →</button>`:""}<button class="${pass?"ghost":"btn"}" id="again2">Retenter ce bloc</button></div>`;
  app.innerHTML=h;window.scrollTo(0,0);
  const n2=document.getElementById("nxt2");if(n2)n2.onclick=()=>start(S.i+1);
  const a2=document.getElementById("again2");if(a2)a2.onclick=()=>start(S.i);
  const n=document.getElementById("nxt");if(n)n.onclick=()=>start(S.i+1);
  document.getElementById("again").onclick=()=>start(S.i);
  document.getElementById("map").onclick=home;
}
home();
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
